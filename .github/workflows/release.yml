name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Verify tag matches manifest.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip the leading "v" — tags are v2.7.0, manifest stores 2.7.0.
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG (=$TAG_VERSION) does not match manifest.json version $MANIFEST_VERSION."
            echo "::error::Bump manifest.json and package.json before tagging."
            exit 1
          fi
          echo "Tag and manifest agree on version $MANIFEST_VERSION."

      # prettier is a pinned devDependency, so it must be installed before
      # the formatting gate. Without npm ci, `npx prettier` would fetch
      # whatever version is latest and could fail a tagged release with no
      # code change.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint locale files
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build XPI
        id: build
        run: node scripts/build-xpi.mjs --out-dir "$RUNNER_TEMP"

      # ATN requires a source archive alongside the XPI. Building it here keeps
      # it in lockstep with the released binary instead of being produced by
      # hand at submission time.
      - name: Build source archive
        run: node scripts/build-source-zip.mjs --out-dir "$RUNNER_TEMP"

      - name: Upload XPI and source archive to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            ${{ steps.build.outputs.xpi_path }}
            ${{ runner.temp }}/templatewing-${{ steps.build.outputs.xpi_version }}-source.zip
          body: |
            **TemplateWing ${{ github.ref_name }}**

            Built automatically from tag `${{ github.ref_name }}` by `.github/workflows/release.yml`.

            - File: `templatewing-${{ steps.build.outputs.xpi_version }}.xpi`
            - Size: `${{ steps.build.outputs.xpi_size }}` bytes
            - SHA-256: `${{ steps.build.outputs.xpi_sha256 }}`

            `templatewing-${{ steps.build.outputs.xpi_version }}-source.zip` contains everything needed to rebuild the XPI (see `SOURCE_README.md`).

            See [CHANGELOG / commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for what changed.
